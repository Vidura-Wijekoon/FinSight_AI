name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Lint needs only the dev tools, not the ~2 GB runtime dependency tree.
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Don't spend 20 minutes installing torch to discover an unused import.
    needs: lint

    env:
      # config/settings.py declares SECRET_KEY and ADMIN_PASSWORD as required
      # fields, so Settings() cannot construct without them. These are throwaway
      # CI values — the real ones live in .env, which is gitignored.
      SECRET_KEY: ci-only-secret-key-not-used-for-anything-real
      ADMIN_PASSWORD: ci-only-admin-password
      ADMIN_USERNAME: admin
      # Tests mock the LLM, so no Ollama daemon is needed on the runner.
      LLM_PROVIDER: ollama
      OLLAMA_MODEL: qwen2.5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # tests/test_retrieval.py loads all-MiniLM-L6-v2 (~90 MB). Without this
      # cache every run re-downloads it from HuggingFace, which is both slow and
      # a third-party availability risk on a job that gates merges.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-${{ runner.os }}

      - name: Run test suite
        run: pytest tests/ -v --tb=short --durations=10

  eval:
    name: retrieval eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    # Gating on retrieval_precision_at_4 in evals/thresholds.json. The floor
    # tolerates one query slipping and fails on two — see evals/README.md.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-${{ runner.os }}

      # Retrieval metrics only. Generation metrics need a local 7B model, which
      # a standard runner cannot host, so they stay local — see evals/README.md.
      - name: Run retrieval evaluation
        run: python evals/run_eval.py

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/results/
          if-no-files-found: warn

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Independent of lint and test: a vulnerable dependency is worth knowing
    # about even on a branch that does not compile.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Fails the build on any known advisory affecting a pinned dependency.
      # pip-audit has no severity threshold flag, so severity is applied in the
      # review of the failure rather than by the tool.
      #
      # Two advisories are accepted rather than fixed. Neither has a fix
      # available, and neither is reachable in this deployment. Both must be
      # re-reviewed if the stated assumption stops holding.
      #
      # PYSEC-2026-311 (chromadb): pre-auth code injection via the ChromaDB
      #   SERVER's HTTP collections endpoint using trust_remote_code. This
      #   project embeds ChromaDB via PersistentClient and never runs its HTTP
      #   API or passes trust_remote_code, so the vulnerable surface is absent.
      #   RE-REVIEW IF: the vector store moves to Chroma server mode.
      #
      # PYSEC-2026-1325 (ecdsa, transitive via python-jose): Minerva timing
      #   attack on P-256 signing, key generation and ECDH. Signature
      #   VERIFICATION is unaffected, and the project considers side-channel
      #   attacks out of scope with no planned fix. This service signs JWTs
      #   with HS256 (HMAC), so no ECDSA code path is exercised.
      #   RE-REVIEW IF: JWT_ALGORITHM changes to an ES* curve algorithm.
      - name: Audit runtime dependencies
        run: |
          pip-audit --requirement requirements.txt --strict --progress-spinner off \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-1325

  container:
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Build only; nothing is pushed from CI. Publication happens on tags in
      # release.yml. Build context is the repository root, so .dockerignore
      # applies — that is what keeps keys/ and .env out of the image.
      - name: Build API image
        run: docker build -f docker/Dockerfile -t finsight-ai:ci .

      # Tag must carry the 'v' prefix: trivy-action migrated all tags to that
      # form after a supply-chain incident, and the unprefixed 0.28.0 does not
      # exist. An unresolvable action fails the job before any step runs.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: finsight-ai:ci
          format: table
          output: trivy-report.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # The findings are what make a failure actionable, and the rendered log is
      # awkward to read from outside the web UI. Written to a file and uploaded
      # so a failed scan can be inspected directly.
      - name: Show scan findings
        if: always()
        run: cat trivy-report.txt || echo "no report produced"

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: warn
