name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # config/settings.py declares SECRET_KEY and ADMIN_PASSWORD as required
      # fields, so Settings() cannot construct without them. These are throwaway
      # CI values — the real ones live in .env, which is gitignored.
      SECRET_KEY: ci-only-secret-key-not-used-for-anything-real
      ADMIN_PASSWORD: ci-only-admin-password
      ADMIN_USERNAME: admin
      # Tests mock the LLM, so no Ollama daemon is needed on the runner.
      LLM_PROVIDER: ollama
      OLLAMA_MODEL: qwen2.5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # all-MiniLM-L6-v2 is ~90 MB. Without this cache every run re-downloads it
      # from HuggingFace, which is both slow and a third-party flake risk.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-${{ runner.os }}

      - name: Run test suite
        run: pytest tests/ -v --tb=short --durations=10
