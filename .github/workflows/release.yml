name: Release

# Publication and SBOM generation share a trigger and a version, so they live
# in one workflow. The SBOM must describe the artefact that was actually
# published, which is easier to guarantee when one run does both.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # attach SBOM artefacts to the release
  packages: write        # push the image to GHCR

jobs:
  publish-image:
    name: Publish API image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Creates the Deployments entry on the repository. The image is the unit of
    # deployment for this system: operators pull it and run it behind their own
    # firewall, since the data sovereignty constraint rules out hosted running.
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: publish-image

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # Generated from requirements.txt rather than an installed environment,
      # so the SBOM reflects the declared dependency set without a multi-GB
      # install of torch on the runner.
      - name: Generate Python SBOM
        run: |
          python -m pip install --upgrade pip cyclonedx-bom
          cyclonedx-py requirements requirements.txt -o sbom-python.json

      - name: Generate frontend SBOM
        working-directory: frontend
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm --output-file ../sbom-frontend.json

      - name: Attach SBOMs to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom-python.json
            sbom-frontend.json
