version: "3.9"

services:
  # ── FastAPI backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../chroma_db:/app/chroma_db
      - ../logs:/app/logs
      - ../keys:/app/keys
    env_file:
      - ../.env
    restart: unless-stopped
    healthcheck:
      # Uses the interpreter already in the image. curl is absent from
      # python:*-slim, so the previous check could never pass, which left the
      # container permanently unhealthy and stopped the frontend from starting.
      # Probes /health (liveness) rather than /ready: a temporarily unreachable
      # Ollama should not cause the API container to be restarted.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── React frontend (served by Nginx after production build) ─────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
